name: Resolve SMB Cargo lockfile

on:
  pull_request:
    paths:
      - "rust-modules/Cargo.toml"
      - "rust-modules/**/Cargo.toml"
      - ".github/workflows/resolve-smb-lock.yml"

permissions:
  contents: write

concurrency:
  group: resolve-smb-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/rust-toolchain

      - name: Resolve the workspace lockfile without updating existing pins
        run: cargo +${RUST_TOOLCHAIN} metadata --manifest-path rust-modules/Cargo.toml --format-version 1 > /dev/null

      - name: Commit the newly resolved lockfile
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- rust-modules/Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-modules/Cargo.lock
          git commit -m "build: resolve SMB dependencies in Cargo.lock"
          git push origin "HEAD:$BRANCH"
